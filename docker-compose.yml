services:
  qdrant:
    image: qdrant/qdrant:latest  # pin the version you test with, e.g. qdrant/qdrant:v1.x.y
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333  # inside compose, services find each other by name
      DAILY_BUDGET: ${DAILY_BUDGET:-150}  # lower it for a load test, so it can't spend quota
      VISITOR_DAILY_LIMIT: ${VISITOR_DAILY_LIMIT:-3}  # raise it for a load test: it all comes from one address
    cpus: 2  # the free Space's CPU Basic has 2 vCPUs: measure what production really gets
    ports: ["8000:7860"]
    depends_on: [qdrant]
    profiles: [full]  # `docker compose up` starts only Qdrant; add `--profile full` for both

volumes:
  qdrant_data: